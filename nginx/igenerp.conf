# ==========================================================================
# NGINX Configuration - igenerp.chungxanhla.name.vn (iGen ERP Reverse Proxy)
# Location on Server (Host VPS): /etc/nginx/sites-available/igenerp.conf
# Enable: ln -s /etc/nginx/sites-available/igenerp.conf /etc/nginx/sites-enabled/
# ==========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    http2 on;
    
    server_name igenerp.chungxanhla.name.vn;

    # Certbot ACME Challenge directory (for SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name igenerp.chungxanhla.name.vn;

    # SSL Certificates (Let's Encrypt path template)
    ssl_certificate /etc/letsencrypt/live/igenerp.chungxanhla.name.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igenerp.chungxanhla.name.vn/privkey.pem;

    # SSL Parameters (Modern security guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # SSL Session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers (OWASP Recommendations)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Main reverse proxy configuration
    location / {
        # --- CẤU HÌNH ĐƯỜNG TRUYỀN PROXY ---
        # TH 1: Nếu Nginx chạy trực tiếp trên Host VPS (Nginx cài bằng apt install):
        proxy_pass http://127.0.0.1:3000;
        
        # TH 2: Nếu Nginx chạy trong Docker Container khác (như igen-legal-pages):
        # proxy_pass http://host.docker.internal:3000;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for Vite HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dedicated Socket.IO configuration with high timeouts to prevent premature closing
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for WebSockets
        proxy_buffering off;

        # Keep WebSocket connection alive (24 hours timeout limit)
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Access and Error logs
    access_log /var/log/nginx/igenerp_access.log;
    error_log /var/log/nginx/igenerp_error.log warn;
}
