name: CI/CD Pipeline

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

# Push nhiều commit liên tiếp: chỉ chạy pipeline cho commit mới nhất.
# PR thì hủy run cũ đang chạy; push (có deploy) thì xếp hàng thay vì hủy giữa chừng
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # BƯỚC 1: KIỂM TRA CHẤT LƯỢNG CODE (Chạy cho cả Push và Pull Request)
  ci-checks:
    name: Step 1 - Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: |
          if [ ! -x /usr/bin/ffmpeg ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          test -x /usr/bin/ffmpeg
          FFMPEG_BIN=/usr/bin/ffmpeg ONNXRUNTIME_NODE_INSTALL_CUDA=skip yarn install --frozen-lockfile

      - name: Type check
        run: yarn lint

      # Chỉ build thử trên PR để bắt lỗi build (vite/esbuild) trước khi merge.
      # Khi push thì bỏ qua vì Step 2 đã build trong Docker rồi — tránh build trùng
      - name: Build check (PR only)
        if: github.event_name == 'pull_request'
        run: yarn build

  # BƯỚC 2: BUILD DOCKER IMAGE (Chỉ chạy khi push/merge và Step 1 thành công)
  build-image:
    name: Step 2 - Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tên image trên registry bắt buộc viết thường; github.repository có chữ hoa
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Giải phóng ~25-30GB dung lượng runner (xóa toolchain không dùng đến)
      # để BuildKit đủ chỗ build image + chuẩn bị cache export
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache trên GHCR (không tính vào giới hạn 10GB GHA cache).
          # mode=max: export cả layer của builder stage — yarn.lock không đổi thì
          # lần build sau nhảy qua bước cài node_modules + có thể tái dùng layer build
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # BƯỚC 3: DEPLOY VPS (Chỉ chạy khi Step 2 thành công)
  deploy:
    name: Step 3 - Deploy to VPS
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Triển khai lên Staging (nhánh develop) ---
      - name: Copy docker-compose.yml to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-marketing/staging"

      - name: Deploy via SSH to Staging VPS
        if: github.ref_name == 'develop'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            TARGET_DIR="/opt/igen-marketing/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="igen-marketing-staging"

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose pull

            # Khởi động lại container mới (Docker compose tự động recreate và restart với downtime tối thiểu)
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose up -d --remove-orphans

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            docker image prune -f

      # --- Triển khai lên Production (nhánh production) ---
      - name: Copy docker-compose.yml to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-marketing/production"

      - name: Deploy via SSH to Production VPS
        if: github.ref_name == 'production'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_PROD }}
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -eu
            TARGET_DIR="/opt/igen-marketing/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="igen-marketing-production"
            IMAGE_REF="ghcr.io/chunga00d1-code/marketing-igen:$IMAGE_TAG"
            previous_image=$(docker inspect --format '{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

            # Tạo thư mục đích nếu chưa tồn tại và chuyển vào
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Tạo/ghi nội dung cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Tải (pull) image mới trước khi tắt container cũ để giảm tối đa downtime
            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"
            df -h /
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml pull
            expected_image=$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")

            rollback() {
              if [ -n "$previous_image" ]; then
                docker tag "$previous_image" "$IMAGE_REF"
                IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --no-deps --no-build igen-marketing
              fi
            }

            # Khởi động lại container mới
            if ! IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --no-build; then
              rollback
              exit 1
            fi

            healthy=0
            if [ "$(docker inspect --format '{{.Image}}' "$CONTAINER_NAME")" = "$expected_image" ]; then
              for attempt in $(seq 1 45); do
                if docker exec "$CONTAINER_NAME" node -e 'Promise.all([fetch("http://127.0.0.1:3005/api/v1/health",{signal:AbortSignal.timeout(3000)}).then(async r=>{const d=await r.json();if(!r.ok||d.status!=="ok"||!String(d.services?.database).startsWith("online"))throw Error("database unhealthy")}),fetch("http://127.0.0.1:3005/",{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)throw Error("frontend unhealthy")})]).catch(()=>process.exit(1))'; then
                  healthy=1
                  break
                fi
                sleep 2
              done
            fi
            if [ "$healthy" != 1 ]; then
              echo "Marketing health check failed; restoring the previous image."
              rollback
              exit 1
            fi
            echo "Marketing production image, frontend and database health checks passed."

            # Giải phóng dung lượng ổ đĩa bằng cách xóa các image dangling/rác cũ
            if [ -n "$previous_image" ] && [ "$previous_image" != "$expected_image" ]; then
              docker image rm "$previous_image" || echo "Previous image is still referenced; retaining it."
            fi
            df -h /
